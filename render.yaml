# Render Blueprint: Dashboard -> New -> Blueprint, pick this repo.
#
# The API and site URLs below assume Render keeps the service names as given
# (voxplay-api.onrender.com, voxplay-web.onrender.com). If it adds a suffix because a
# name is taken, fix NEXT_PUBLIC_API_URL and CORS_ORIGINS, then redeploy voxplay-web
# (the API address is baked into the site at build time).
#
# Everything sits in one region so the API reaches Postgres and Key Value privately.

databases:
  - name: voxplay-db
    region: oregon
    # Free databases are deleted after 30 days; switch to basic-256mb or larger to keep data.
    plan: free
    databaseName: voiceid
    user: voiceid
    postgresMajorVersion: "16"

services:
  # Game rooms, liveness phrases and rate limits. Nothing here needs to outlive a restart
  # for long, so the free (non-persistent) plan is fine.
  - type: keyvalue
    name: voxplay-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # only reachable from this account's services

  - type: web
    name: voxplay-api
    runtime: docker
    region: oregon
    # The API needs ~610 MB with both models loaded; Free and Starter (512 MB) run out of memory.
    plan: standard
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voxplay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voxplay-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAMES
        sync: false # asked for when the Blueprint is created
      - key: CORS_ORIGINS
        value: https://voxplay-web.onrender.com
      - key: SEED_SAMPLE_VOICES
        value: "true"
      - key: REQUIRE_LIVENESS
        value: "true"
      # Render's proxy sets X-Forwarded-For, so per-IP rate limits see real visitors.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: TORCH_THREADS
        value: "1"

  - type: web
    name: voxplay-web
    runtime: docker
    region: oregon
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      # Render passes env vars to the Docker build as build args (frontend/Dockerfile's ARG).
      - key: NEXT_PUBLIC_API_URL
        value: https://voxplay-api.onrender.com
