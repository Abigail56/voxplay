# Ports are shifted (5442, 6389, 8010, 3010) so they do not clash with a local
# PostgreSQL on 5432, Redis on 6379 or other apps on 8000/3000. Each can be moved
# in .env (DB_PORT, REDIS_PORT, API_PORT, WEB_PORT) if something else holds it.
name: voice-id

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voiceid
      POSTGRES_PASSWORD: voiceid
      POSTGRES_DB: voiceid
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceid -d voiceid"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Game rooms, liveness phrases (expire, single use), rate limits and live updates.
  # The append-only file is on so games in progress survive a restart; keys still expire, and
  # Redis compacts the file often (from 16 MB), which drops expired clips from disk.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec", "--auto-aof-rewrite-min-size", "16mb"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceid:voiceid@db:5432/voiceid
      TEST_DATABASE_URL: postgresql+asyncpg://voiceid:voiceid@db:5432/voiceid_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/1
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.40}
      # Set to false to send /identify plain recordings without a spoken phrase (e.g. scripts/e2e_demo.py).
      REQUIRE_LIVENESS: ${REQUIRE_LIVENESS:-true}
      # Signs game sign-in tokens. Put a long random value in .env for anything beyond your own laptop.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      # Player names who can open /admin, comma-separated (e.g. "chi,rita"). Set it in .env.
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      # The Voice ID UI (3010) and the portfolio demo page (3001) may call this API.
      # Going public (e.g. Tailscale Funnel)? Add the site's https address in .env.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3010,http://localhost:3001}
      # The built-in LibriSpeech readers: solo play needs them, and they give the AI someone else to pick.
      SEED_SAMPLE_VOICES: ${SEED_SAMPLE_VOICES:-true}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - models:/models          # pretrained model cache (downloaded once)
      - ./data:/data            # sample voices for scripts/ (optional)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  web:
    build:
      context: ./frontend
      args:
        # Where browsers reach the API. Baked into the site at build time: rebuild after changing it.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8010}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3010}:3000"
    depends_on:
      - api

  # A compressed pg_dump of the database every BACKUP_INTERVAL_HOURS into ./backups,
  # keeping the newest BACKUP_KEEP. Restore: see "Backups" in the README.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: voiceid
      PGPASSWORD: voiceid
      PGDATABASE: voiceid
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/voiceid-$$(date +%Y%m%d-%H%M%S).sql.gz
          if pg_dump --no-owner | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup: $$f"; else rm -f "$$f.tmp"; echo "backup FAILED"; fi
          ls -1t /backups/voiceid-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
  redisdata:
